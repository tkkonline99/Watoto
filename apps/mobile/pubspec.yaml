name: watoto_mobile
description: "Watoto — playful, safe learning for children aged 0-10."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  path_provider: ^2.1.5
  # On-device text-to-speech for spoken narration (audio-first 0–5 band). All
  # calls are guarded so unsupported platforms / tests degrade to silence.
  flutter_tts: ^4.2.0
  # Short bundled sound effects (tap / success / celebration). Guarded like
  # TTS. On web the plugin's global event channel is broken, so sound plays
  # through an HTMLAudioElement instead (core/audio/sfx_backend_web.dart).
  audioplayers: ^6.1.0
  web: ^1.1.0
  # Parent-facing practice reminders (docs/12 §12.6 — opt-in, never to a
  # child). Guarded like TTS/SFX: unsupported platforms degrade to silence.
  # Web has no local-notification path, so the seam stubs out there.
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# One source image → every platform's launcher icon. After editing
# branding/app_icon.png, regenerate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#023047"
    theme_color: "#219EBC"
  windows:
    generate: true
    icon_size: 256

# Localizations generate to lib/l10n/gen (see l10n.yaml).
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    # Named one by one rather than as a directory, so `assets/i18n/en.json`
    # stays on disk for the translators and the coverage tests without being
    # shipped. It is extracted from the content library, so every value in it
    # is a string the app already carries — see ContentI18n.
    - assets/i18n/fr.json
    - assets/i18n/sw.json
    - assets/legal/
    - assets/licenses/
    - assets/audio/sfx/
    - assets/guides/
    - assets/images/
    # Asset directories are NOT recursive: without a line per stage the
    # illustration pack sits on disk unbundled and every item falls back to an
    # emoji placeholder. test/media_assets_test.dart samples one hero per stage
    # so a forgotten line here fails the suite instead of shipping.
    - assets/images/img/s01/
    - assets/images/img/s02/
    - assets/images/img/s03/
    - assets/images/img/s04/
    - assets/images/img/s05/
    - assets/images/img/s06/
    - assets/images/img/s07/
    - assets/images/img/s08/
    - assets/images/img/s09/
    - assets/images/img/s10/
    # Photographs that stand in for a lexicon glyph, so they belong to a word
    # rather than to a stage. test/option_photos_test.dart fails if one the
    # registry names is not bundled.
    - assets/images/img/photo/
    # The rendered VO pack (assets/audio/{en,fr,sw}) is deliberately NOT listed.
    # It is 184 MB — past Play's base-download ceiling — and is not in git, so a
    # fresh clone would fail `flutter pub get` on a missing directory. Narration
    # falls back to on-device TTS without it. To build the VO edition, render the
    # pack (tool/export_tts_vo.py) and add the three lines; see tool/MEDIA_README.md.
  # Bundled variable fonts (offline-safe; no runtime fetch). Baloo 2 for the
  # rounded headings/buttons, Nunito for body. Both expose a `wght` axis.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
