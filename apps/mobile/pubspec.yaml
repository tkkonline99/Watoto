name: watoto_mobile
description: "Watoto — playful, safe learning for children aged 0-10."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  path_provider: ^2.1.5
  # On-device text-to-speech for spoken narration (audio-first 0–5 band). All
  # calls are guarded so unsupported platforms / tests degrade to silence.
  flutter_tts: ^4.2.0
  # Short bundled sound effects (tap / success / celebration). Guarded like TTS.
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# One source image → every platform's launcher icon. After editing
# branding/app_icon.png, regenerate with:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    background_color: "#023047"
    theme_color: "#219EBC"
  windows:
    generate: true
    icon_size: 256

# Localizations generate to lib/l10n/gen (see l10n.yaml).
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/i18n/
    - assets/legal/
    - assets/licenses/
    - assets/audio/sfx/
  # Bundled variable fonts (offline-safe; no runtime fetch). Baloo 2 for the
  # rounded headings/buttons, Nunito for body. Both expose a `wght` axis.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
