# Analyzer + linter configuration for Watoto mobile.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    invalid_assignment: error
    missing_required_param: error
    missing_return: error
    dead_code: warning

linter:
  rules:
    avoid_print: true
    # On since the cleanup pass it was waiting for: there were ten, all of
    # them haptics, route pushes or narration that nothing should wait for.
    # Its value is the next one — a dropped await is how the first item of
    # a session came to be narrated in English (cold_start_i18n_test.dart).
    unawaited_futures: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    unnecessary_this: true
    use_key_in_widget_constructors: true
    cancel_subscriptions: true
    close_sinks: true
